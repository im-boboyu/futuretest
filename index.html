        { name: "🦞 麻辣小龙虾", dim: {sweet: 2, spicy: 8, sour: 2, savory: 8}, tags: ["社交牛逼症", "享受当下", "反差萌"], text: "🍻 <strong>【你的性格】</strong> 没有一顿小龙虾解决不了的事。你是一个极其有生活情趣的人，懂得享受生活。你不拘小节，喜欢热热闹闹的氛围。你剥虾的技术一定很好（动手能力强），总是能把平淡的日子过得有声有色。<br><br>💡 <strong>【隐藏反差】</strong> 吃完小龙虾的你，卸下外壳，其实内心很细腻，也会害怕孤单，很需要有人懂你的言外之意。<br><br>⚠️ <strong>【小缺点】</strong> 嘴巴太快，有时候说话不过脑子容易伤人；偶尔有点小败家。" },
        { name: "🥥 生椰拿铁", dim: {sweet: 6, spicy: 3, sour: 5, savory: 6}, tags: ["潮流达人", "平衡大师", "表面佛系"], text: "🥤 <strong>【你的性格】</strong> 你是一个各方面都很平衡的人。像生椰拿铁一样，既有咖啡的现实与清醒，又有椰乳的浪漫与柔软。你很懂现在流行的趋势，人际交往中既不会太锋芒毕露，也不会显得毫无存在感。<br><br>💡 <strong>【隐藏反差】</strong> 表面上你是个很随和的“端水大师”，其实内心有自己的小骄傲和独特的倔强。<br><br>⚠️ <strong>【小缺点】</strong> 有时候想得太多，容易在几个选项之间反复横跳、纠结不定。" },

    let currentIdx = 0;
    let scores = { sweet: 0, spicy: 0, sour: 0, savory: 0 };
    let baseTestCount = 7825; // 初始测试人数

    function init() { document.getElementById('q-total').innerText = questions.length; }

    function startQuiz() {
        document.getElementById('page-cover').classList.remove('active');
        document.getElementById('page-quiz').classList.add('active');
        currentIdx = 0;
        for (let k in scores) scores[k] = 0;
        renderQ();
    }

    function renderQ() {
        if (currentIdx >= questions.length) { calcResult(); return; }
        const q = questions[currentIdx];
        document.getElementById('q-current').innerText = currentIdx + 1;
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('progress-fill').style.width = (currentIdx / questions.length * 100) + '%';
        
        const box = document.getElementById('options-container');
        box.innerHTML = '';
        // 打乱选项
        const shuffled = q.opts.sort(() => Math.random() - 0.5);
        shuffled.forEach(opt => {
            const div = document.createElement('div');
            div.className = 'option';
            div.innerText = opt.t;
            div.onclick = () => selectOpt(div, opt.val);
            box.appendChild(div);
        });
    }

    function selectOpt(el, val) {
        if (document.getElementById('options-container').classList.contains('lock')) return;
        document.getElementById('options-container').classList.add('lock');
        
        document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
        el.classList.add('selected');

        for (let k in val) { if (scores[k] !== undefined) scores[k] += val[k]; }

        setTimeout(() => {
            document.getElementById('options-container').classList.remove('lock');
            currentIdx++;
            renderQ();
        }, 250);
    }

    function calcResult() {
        document.getElementById('page-quiz').classList.remove('active');
        document.getElementById('page-result').classList.add('active');

        let nowCount = baseTestCount + Math.floor(Math.random() * 5) + 1;
        document.getElementById('test-count-badge').innerText = `🎉 你是第 ${nowCount} 个测出灵魂食物的人`;

        // 归一化用户的分数
        let userVec = {};
        let max = Math.max(...Object.values(scores));
        for (let k in scores) userVec[k] = (scores[k] / (max || 1)) * 10; 

        let bestFood = null;
        let minDist = Infinity;

        foods.forEach(food => {
            let dist = 0;
            for (let k in userVec) {
                dist += Math.abs(userVec[k] - food.dim[k]);
            }
            if (dist < minDist) { minDist = dist; bestFood = food; }
        });

        document.getElementById('res-name').innerText = bestFood.name;
        const tagBox = document.getElementById('res-tags');
        tagBox.innerHTML = '';
        bestFood.tags.forEach(t => {
            const s = document.createElement('span');
            s.className = 'tag';
            s.innerText = '#' + t;
            tagBox.appendChild(s);
        });
        document.getElementById('res-content').innerHTML = bestFood.text;
    }

    function restartQuiz() {
        document.getElementById('page-result').classList.remove('active');
        document.getElementById('page-cover').classList.add('active');
    }

    window.onload = init;
</script>
